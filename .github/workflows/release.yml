name: Release

on:
  push:
    branches:
      - principal

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-principal
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'centralmacatuba/mcp' && vars.NPM_RELEASE_ENABLED == 'true'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.12.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify npm version for Trusted Publishing
        run: |
          node --version
          npm --version
          node -e "const [major, minor, patch] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && (minor < 14 || (minor === 14 && patch < 0)))) process.exit(1)"
          npm --version | awk -F. '{ if ($1 < 11 || ($1 == 11 && $2 < 5) || ($1 == 11 && $2 == 5 && $3 < 1)) exit 1 }'

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml is not committed yet; using a non-frozen install until @centralmacatuba/api@0.1.0 is published and the lockfile is generated."
            pnpm install --no-frozen-lockfile
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package consumer smoke test
        run: pnpm test:package

      - name: Verify package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Create version PR or publish release
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          commit: "chore: update package versions"
          title: "chore: update package versions"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Reconcile GitHub Packages on every successful run. This also recovers
      # when npm publishing succeeded but the GitHub Packages step previously failed.
      - name: Publish or reconcile GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PACKAGES_REGISTRY: https://npm.pkg.github.com
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          NPM_REGISTRY="https://registry.npmjs.org/"

          # Return 0 when the version exists, 1 only for a genuine 404,
          # and 2 for registry/network/authentication failures.
          registry_has_version() {
            local registry="$1"
            local error_file
            error_file="$(mktemp)"

            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry="$registry" >/dev/null 2>"$error_file"; then
              rm -f "$error_file"
              return 0
            fi

            if grep -Eqi 'E404|404 Not Found|No match found' "$error_file"; then
              rm -f "$error_file"
              return 1
            fi

            cat "$error_file" >&2
            rm -f "$error_file"
            return 2
          }

          if registry_has_version "$NPM_REGISTRY"; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is available on npm."
          else
            result=$?
            if [[ "$result" -eq 1 ]]; then
              echo "::notice::${PACKAGE_NAME}@${PACKAGE_VERSION} is not available on npm yet; skipping GitHub Packages."
              exit 0
            fi
            echo "::error::Could not verify ${PACKAGE_NAME}@${PACKAGE_VERSION} on npm."
            exit "$result"
          fi

          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN" --location=user

          if registry_has_version "$GITHUB_PACKAGES_REGISTRY"; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on GitHub Packages."
            exit 0
          else
            result=$?
            if [[ "$result" -ne 1 ]]; then
              echo "::error::Could not verify ${PACKAGE_NAME}@${PACKAGE_VERSION} on GitHub Packages."
              exit "$result"
            fi
          fi

          # package.json pins npm as the primary registry. Change the publish-time
          # registry explicitly because publishConfig can override --registry.
          node <<'NODE'
          const fs = require("node:fs");
          const path = "package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          pkg.publishConfig = {
            ...pkg.publishConfig,
            registry: process.env.GITHUB_PACKAGES_REGISTRY
          };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\\n`);
          NODE

          npm publish --registry="$GITHUB_PACKAGES_REGISTRY"
