name: CI

on:
  push:
    branches: [principal]
  pull_request:
    branches: [principal]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node.js 22)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Checkout API SDK source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: centralmacatuba/api-sdk
          ref: 4582e6591ecdd197ccbc03a8edec92ff9dac71da
          path: api-sdk
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.12.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Build local API SDK dependency
        working-directory: api-sdk
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Link the in-development API SDK for CI
        run: |
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.dependencies['@centralmacatuba/api']='file:./api-sdk';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n')"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Documentation tests
        run: pnpm docs:test

      - name: Documentation build
        run: pnpm docs:build

      - name: Build
        run: pnpm build

      - name: Package consumer smoke test
        run: pnpm test:package

      - name: Verify MCP App bundles
        run: |
          for app in tempo servicos mapa jornal informacoes cursos sos; do
            test -s "dist/apps/$app.html"
          done

      - name: Restore published dependency metadata
        run: |
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.dependencies['@centralmacatuba/api']='^0.1.0';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n')"

      - name: Validate npm package contents
        run: |
          npm pack --dry-run --ignore-scripts --json > npm-pack.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const [pack] = JSON.parse(fs.readFileSync("npm-pack.json", "utf8"));
          const files = new Set(pack.files.map(({ path }) => path));
          const required = [
            "dist/index.js", "dist/index.d.ts",
            "dist/http.js", "dist/http.d.ts",
            "dist/stdio.js", "dist/stdio.d.ts",
            "dist/cli.js",
            ...["tempo", "servicos", "mapa", "jornal", "informacoes", "cursos", "sos"].map((name) => "dist/apps/" + name + ".html"),
            "README.md", "LICENSE"
          ];
          const missing = required.filter((path) => !files.has(path));
          if (missing.length) {
            console.error("Arquivos ausentes no pacote npm: " + missing.join(", "));
            process.exit(1);
          }
          console.log("Pacote validado: " + files.size + " arquivos.");
          NODE
