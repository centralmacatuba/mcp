name: CI

on:
  push:
    branches: [principal, "feat/**"]
  pull_request:
    branches: [principal]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node.js 22)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Checkout API SDK source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: centralmacatuba/api-sdk
          ref: feat/sdk-inicial
          path: api-sdk
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.12.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Build local API SDK dependency
        working-directory: api-sdk
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Link the in-development API SDK for CI
        run: |
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.dependencies['@centralmacatuba/api']='file:./api-sdk';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n')"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify MCP App bundle
        run: test -s dist/apps/tempo.html

      - name: Validate npm package contents
        run: npm pack --dry-run --ignore-scripts
