version: 2
updates:
  - package-ecosystem: pnpm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees:
      - centralmacatuba
      - desenvolvedor-ee
      - desenvolvedoree-bot
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees:
      - centralmacatuba
      - desenvolvedor-ee
      - desenvolvedoree-bot
