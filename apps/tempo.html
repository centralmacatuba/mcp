<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Tempo Macatuba</title>
<style>
:root{font:15px/1.5 system-ui,sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:clamp(14px,4vw,28px);color:var(--color-text-primary,CanvasText);background:var(--color-background-primary,Canvas)}main{max-width:900px;margin:auto}header{margin-bottom:18px}h1{font-size:1.4rem;margin:0 0 5px}p{color:var(--color-text-secondary,GrayText)}button{font:inherit;font-weight:600;padding:9px 16px;border:0;border-radius:8px;background:#d00;color:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#status{padding:10px;border-radius:8px;background:color-mix(in srgb,currentColor 7%,transparent)}#status[data-state=error]{color:#d44}#status[data-state=success]{color:#298653}.list{display:grid;gap:10px}.item,.object{border:1px solid color-mix(in srgb,currentColor 18%,transparent);border-radius:10px;padding:12px;overflow-wrap:anywhere}.item h2{font-size:1rem;margin:0 0 8px}.object{display:grid;gap:8px}.field{border-bottom:1px solid color-mix(in srgb,currentColor 15%,transparent);padding:6px 0}.field:last-child{border:0}dt{font-size:.8rem;color:var(--color-text-secondary,GrayText);text-transform:capitalize}dd{margin:3px 0 0}.value{white-space:pre-wrap;margin:0}.muted{color:var(--color-text-secondary,GrayText)}details{margin-top:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere}
