<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Streaming - Serviços Macatuba</title>
<style>
:root{color-scheme:light dark;font:15px/1.5 system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:clamp(16px,4vw,28px);background:var(--color-background,#fff);color:var(--color-text,#202124)}main{max-width:1000px;margin:auto}header{margin-bottom:20px}h1{font-size:1.55rem;margin:0 0 6px}p,.hint{color:var(--color-text-secondary,#666)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:18px 0}.field{display:grid;gap:4px;flex:1;min-width:150px}label{font-size:.9rem}button,select,input{font:inherit;border-radius:9px;padding:10px 13px;border:1px solid var(--color-border,#aaa)}button{cursor:pointer;background:var(--color-primary,#2459a6);color:white;border:0}button:disabled{opacity:.55;cursor:wait}select,input{width:100%;background:var(--color-background,#fff);color:inherit}.status{padding:10px 12px;border-radius:8px;background:var(--color-secondary-background,#eee);margin:12px 0}#results{display:grid;gap:10px}.item{padding:14px;border:1px solid var(--color-border,#ccc);border-radius:10px;overflow-wrap:anywhere}.item h2{font-size:1rem;margin:0 0 6px}.item p{margin:4px 0}.muted{font-size:.85rem;color:var(--color-text-secondary,#777)}details{margin-top:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.82rem}.actions{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body><main data-mcp-app data-app-name="Streaming - Serviços Macatuba" data-tool="servicos_streaming.pesquisar">
<header><h1>Streaming - Serviços Macatuba</h1><p>Explore rádios, podcasts, TV, vídeos, câmeras e transmissões ao vivo.</p></header>
<p class="hint">Escolha uma categoria para pesquisar o catálogo. As transmissões ao vivo e agendadas do YouTube são consultadas separadamente.</p>
<form id="search-form">
<div class="toolbar">
<div class="field"><label for="tipo">Categoria</label><select id="tipo" name="tipo"><option value="radio">Rádio</option><option value="podcast">Podcast</option><option value="tv">TV</option><option value="vod">Vídeo sob demanda</option><option value="camera">Câmeras</option></select></div>
<div class="field"><label for="p">Termo de pesquisa</label><input id="p" name="p" type="search" placeholder="Nome ou descrição"></div>
<div class="field"><label for="filtro">Pesquisar em</label><select id="filtro" name="filtro"><option value="">Todos os campos</option></select></div>
<div class="actions"><button id="search" type="submit">Pesquisar catálogo</button><button id="live" type="button">Ver transmissões ao vivo</button></div>
</div>
</form>
<div class="toolbar" id="pagination" hidden><div class="field"><label for="page">Página</label><input id="page" type="number" min="1" value="1"></div><div class="field"><label for="limit">Itens por página</label><input id="limit" type="number" min="1" max="100" value="20"></div><button id="previous" type="button" disabled>Anterior</button><button id="next" type="button" disabled>Próxima</button><span id="page-info" class="muted" aria-live="polite"></span></div>
<div id="status" class="status" role="status" aria-live="polite">Conectando ao host MCP Apps…</div>
<section id="results" aria-live="polite"></section>
<details><summary>Ver resposta original</summary><pre id="raw"></pre></details>
</main>
<script type="module">
import { App, applyDocumentTheme } from "@modelcontextprotocol/ext-apps";
const SEARCH_TOOL="servicos_streaming.pesquisar";
const LIVE_TOOL="servicos_streaming.live_verificar";
const app=new App({name:"Streaming - Serviços Macatuba",version:"1.0.0"});
const pagination=document.querySelector("#pagination"),page=document.querySelector("#page"),limit=document.querySelector("#limit"),pageInfo=document.querySelector("#page-info"),previous=document.querySelector("#previous"),next=document.querySelector("#next");
const form=document.querySelector("#search-form"),type=document.querySelector("#tipo"),term=document.querySelector("#p"),filter=document.querySelector("#filtro"),search=document.querySelector("#search"),live=document.querySelector("#live"),status=document.querySelector("#status"),results=document.querySelector("#results"),raw=document.querySelector("#raw");
const filters={radio:["nome","descricao_curta","descricao_longa","tipo"],podcast:["nome","descricao_curta","descricao_longa","tipo"],tv:["nome","descricao_curta","descricao_longa","categoria","qualidade"],vod:["nome","descricao_curta","descricao_longa","categoria","classificacao"],camera:["nome","descricao_longa","tipo_stream"]};
function updateFilters(){const previous=filter.value;filter.replaceChildren();const all=document.createElement("option");all.value="";all.textContent="Todos os campos";filter.append(all);for(const value of filters[type.value]){const option=document.createElement("option");option.value=value;option.textContent=value.replaceAll("_"," ");filter.append(option)}if(filters[type.value].includes(previous))filter.value=previous}
function extractPayload(response){const structured=response?.structuredContent??response;if(response?.isError||structured?.isError){const message=(response?.content??structured?.content??[]).map(item=>item?.text??"").filter(Boolean).join("\n");throw new Error(message||"A ferramenta retornou um erro.")}let value=structured;if(value&&typeof value==="object"&&!Array.isArray(value)&&Object.hasOwn(value,"result"))value=value.result;if(value&&typeof value==="object"&&!Array.isArray(value)){for(const key of ["dados","itens","alertas","items","results","data","transmissoes","registros"]){if(Array.isArray(value[key]))return value[key]}}return value}
function render(response){const value=extractPayload(response);results.replaceChildren();const rows=Array.isArray(value)?value:(value&&typeof value==="object"?Object.entries(value).map(([key,item])=>({[key]:item})):[]);if(!rows.length){const empty=document.createElement("p");empty.textContent=typeof value==="string"?value:"Nenhum registro encontrado.";results.append(empty);return}rows.slice(0,100).forEach((row,index)=>{const card=document.createElement("article");card.className="item";const object=row&&typeof row==="object"&&!Array.isArray(row)?row:{valor:row};const title=Object.entries(object).find(([key,item])=>typeof item==="string"&&/nome|titulo|title|name|programa|canal|radio|podcast/i.test(key));const heading=document.createElement("h2");heading.textContent=title?title[1]:"Registro "+(index+1);card.append(heading);Object.entries(object).slice(0,20).forEach(([key,item])=>{if(title&&key===title[0])return;const field=document.createElement("p");field.textContent=key.replace(/[_-]+/g," ")+": "+(item===null||item===undefined?"—":typeof item==="object"?JSON.stringify(item):String(item));card.append(field)});results.append(card)});if(rows.length>100){const more=document.createElement("p");more.className="muted";more.textContent="Exibindo os primeiros 100 de "+rows.length+" registros.";results.append(more)}}
function showPagination(response){const s=response?.structuredContent??response,m=s?.pagination??s?.paginacao,body=s?.result??s,rows=Array.isArray(body?.data)?body.data:Array.isArray(body?.registros)?body.registros:Array.isArray(body)?body:[];const current=Number(m?.page??m?.pagina??page.value),total=Number(m?.totalPages??m?.total_paginas??0),hasPrev=m?.hasPreviousPage??current>1,hasNext=m?.hasNextPage??(total>0?current<total:rows.length>=Number(limit.value));page.value=String(current);pageInfo.textContent=total>0?"Página "+current+" de "+total:"Página "+current+" · "+limit.value+" itens por página";previous.disabled=!hasPrev;next.disabled=!hasNext}
async function callTool(name,args,label){const paginated=name===SEARCH_TOOL;pagination.hidden=!paginated;if(paginated){args.page=Math.max(1,Number(page.value||1));args.limit=Math.min(100,Math.max(1,Number(limit.value||20)))}search.disabled=true;live.disabled=true;status.textContent=label;results.replaceChildren();try{const response=await app.callServerTool({name,arguments:args});raw.textContent=JSON.stringify(response,null,2);render(response);if(paginated)showPagination(response);status.textContent="Consulta concluída.";return response}catch(error){status.textContent="Não foi possível consultar: "+(error?.message??"erro desconhecido");return null}finally{search.disabled=false;live.disabled=false}}
previous.addEventListener("click",()=>{page.value=String(Math.max(1,Number(page.value||1)-1));form.requestSubmit()});next.addEventListener("click",()=>{page.value=String(Number(page.value||1)+1);form.requestSubmit()});limit.addEventListener("change",()=>{page.value="1"});
type.addEventListener("change",updateFilters);
form.addEventListener("submit",event=>{event.preventDefault();const args={tipo:type.value};if(term.value.trim())args.p=term.value.trim();if(filter.value)args.filtro=filter.value;callTool(SEARCH_TOOL,args,"Pesquisando catálogo de "+type.options[type.selectedIndex].text.toLowerCase()+"…")});
live.addEventListener("click",()=>callTool(LIVE_TOOL,{},"Consultando transmissões ao vivo e agendadas…"));
app.onhostcontextchanged=ctx=>{if(ctx?.theme)applyDocumentTheme(ctx.theme)};
try{await app.connect();status.textContent="Conectado. Escolha uma categoria ou consulte as transmissões ao vivo."}catch(error){status.textContent="Este host não concluiu a conexão MCP Apps. Use as ferramentas textuais do servidor."}
updateFilters();
</script></body></html>
