<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novidades</title>
<style>
:root{color-scheme:light dark;font:15px/1.5 system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:clamp(16px,4vw,28px);background:var(--color-background,#fff);color:var(--color-text,#202124)}main{max-width:1000px;margin:auto}header{margin-bottom:20px}h1{font-size:1.55rem;margin:0 0 6px}p,.hint{color:var(--color-text-secondary,#666)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:18px 0}.field{display:grid;gap:4px;flex:1;min-width:170px}label{font-size:.9rem}button,select,input{font:inherit;border-radius:9px;padding:10px 13px;border:1px solid var(--color-border,#aaa)}button{cursor:pointer;background:var(--color-primary,#2459a6);color:white;border:0}button:disabled{opacity:.55;cursor:wait}select,input{width:100%;background:var(--color-background,#fff);color:inherit}.status{padding:10px 12px;border-radius:8px;background:var(--color-secondary-background,#eee);margin:12px 0}#results{display:grid;gap:10px}.item{padding:14px;border:1px solid var(--color-border,#ccc);border-radius:10px;overflow-wrap:anywhere}.item h2{font-size:1rem;margin:0 0 6px}.item p{margin:4px 0}.muted{font-size:.85rem;color:var(--color-text-secondary,#777)}details{margin-top:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.82rem}.actions{display:flex;gap:10px;flex-wrap:wrap}
</style></head><body><main data-mcp-app data-app-name="Novidades" data-tool="novidades.pesquisar"><header><h1>Novidades</h1><p>Acompanhe novidades, atualizações e avisos ativos da Central Macatuba.</p></header>
<div class="toolbar"><div class="field"><label for="action">Ação</label><select id="action"><option value="0">Pesquisar novidades</option><option value="1">Ver novidades</option><option value="2">Ver avisos ativos</option></select></div><div class="field"><label for="term">Termo de pesquisa / identificador</label><input id="term" type="search" placeholder="Digite um termo, data ou slug"></div><div class="field" id="year-field"><label for="year">Ano</label><input id="year" type="number" min="1" max="9999" placeholder="Ano (opcional)"></div><button id="run" type="button">Consultar</button></div>
<div class="toolbar" id="pagination" hidden><div class="field"><label for="page">Página</label><input id="page" type="number" min="1" value="1"></div><div class="field"><label for="limit">Itens por página</label><input id="limit" type="number" min="1" max="100" value="20"></div><button id="previous" type="button" disabled>Anterior</button><button id="next" type="button" disabled>Próxima</button><span id="page-info" class="muted" aria-live="polite"></span></div>
<p class="hint" id="hint">Selecione uma ação e consulte os dados disponíveis.</p><div id="status" class="status" role="status" aria-live="polite">Conectando ao host MCP Apps…</div><section id="results" aria-live="polite"></section><details><summary>Ver resposta original</summary><pre id="raw"></pre></details></main>
<script type="module">
import {App,applyDocumentTheme} from "@modelcontextprotocol/ext-apps";
const ACTIONS=[{"tool":"novidades.pesquisar","label":"Pesquisar novidades","args":"search"},{"tool":"novidades.verificar","label":"Ver novidades","args":"verify"},{"tool":"avisos.verificar","label":"Ver avisos ativos","args":"empty"}];
const app=new App({name:"Novidades",version:"1.0.0"});
const pagination=document.querySelector("#pagination"),page=document.querySelector("#page"),limit=document.querySelector("#limit"),pageInfo=document.querySelector("#page-info"),previous=document.querySelector("#previous"),next=document.querySelector("#next");
const action=document.querySelector("#action"),term=document.querySelector("#term"),year=document.querySelector("#year"),yearField=document.querySelector("#year-field"),run=document.querySelector("#run"),status=document.querySelector("#status"),results=document.querySelector("#results"),raw=document.querySelector("#raw"),hint=document.querySelector("#hint");
function update(){const a=ACTIONS[Number(action.value)];term.value="";term.placeholder=a.args==="verify"?"ID da novidade (opcional)":a.args==="date"?"AAAA-MM-DD":a.args==="slug"?"Slug do documento":a.args==="game"?"ID, nome ou slug":a.args==="search"?"Termo de pesquisa":"Parâmetro opcional";yearField.hidden=a.args!=="year";term.parentElement.hidden=a.args==="year"||a.args==="empty";hint.textContent=a.tool;pagination.hidden=!["novidades.pesquisar","novidades.verificar"].includes(a.tool)}
function extract(response){const s=response?.structuredContent??response;if(response?.isError||s?.isError)throw new Error((response?.content??[]).map(x=>x.text??"").join("\n")||"A ferramenta retornou um erro.");let v=s;if(v&&typeof v==="object"&&!Array.isArray(v)&&Object.hasOwn(v,"result"))v=v.result;if(v&&typeof v==="object"&&!Array.isArray(v)){for(const k of ["dados","itens","alertas","items","results","data","eventos","documentos","jogos","novidades","registros"]){if(Array.isArray(v[k]))return v[k]}}return v}
function render(response){const v=extract(response);results.replaceChildren();const rows=Array.isArray(v)?v:(v&&typeof v==="object"?Object.entries(v).map(([k,x])=>({[k]:x})):[]);if(!rows.length){const p=document.createElement("p");p.textContent=typeof v==="string"?v:"Nenhum registro encontrado.";results.append(p);return}rows.slice(0,100).forEach((row,i)=>{const card=document.createElement("article");card.className="item";const obj=row&&typeof row==="object"&&!Array.isArray(row)?row:{valor:row};const title=Object.entries(obj).find(([k,x])=>typeof x==="string"&&/nome|titulo|title|name|evento|documento|jogo/i.test(k));const h=document.createElement("h2");h.textContent=title?title[1]:"Registro "+(i+1);card.append(h);Object.entries(obj).slice(0,20).forEach(([k,x])=>{if(title&&k===title[0])return;const p=document.createElement("p");p.textContent=k.replace(/[_-]+/g," ")+": "+(x===null||x===undefined?"—":typeof x==="object"?JSON.stringify(x):String(x));card.append(p)});results.append(card)});if(rows.length>100){const p=document.createElement("p");p.className="muted";p.textContent="Exibindo os primeiros 100 de "+rows.length+" registros.";results.append(p)}}
function showPagination(response){const s=response?.structuredContent??response,m=s?.pagination??s?.paginacao,body=s?.result??s,rows=Array.isArray(body?.data)?body.data:Array.isArray(body?.novidades)?body.novidades:Array.isArray(body)?body:[];const current=Number(m?.page??m?.pagina??page.value),total=Number(m?.totalPages??m?.total_paginas??0),hasPrev=m?.hasPreviousPage??current>1,hasNext=m?.hasNextPage??(total>0?current<total:rows.length>=Number(limit.value));page.value=String(current);pageInfo.textContent=total>0?"Página "+current+" de "+total:"Página "+current+" · "+limit.value+" itens por página";previous.disabled=!hasPrev;next.disabled=!hasNext}
async function execute(){const a=ACTIONS[Number(action.value)],args={};if(["novidades.pesquisar","novidades.verificar"].includes(a.tool)){args.page=Math.max(1,Number(page.value||1));args.limit=Math.min(100,Math.max(1,Number(limit.value||20)))}if(a.args==="year"&&year.value)args.ano=Number(year.value);if(a.args==="date"&&term.value.trim())args.data=term.value.trim();if(a.args==="slug"&&term.value.trim())args.slug=term.value.trim();if(a.args==="game"&&term.value.trim()){const value=term.value.trim();if(/^\d+$/.test(value))args.id=Number(value);else args.slug=value}if(a.args==="search"&&term.value.trim())args.q=term.value.trim();if(a.args==="verify"&&term.value.trim()){if(!/^\d+$/.test(term.value.trim())){status.textContent="Informe um ID numérico para consultar uma novidade específica.";return}args.funcao="uma";args.id=Number(term.value.trim())}run.disabled=true;status.textContent="Consultando "+a.tool+"…";results.replaceChildren();try{const response=await app.callServerTool({name:a.tool,arguments:args});raw.textContent=JSON.stringify(response,null,2);render(response);if(["novidades.pesquisar","novidades.verificar"].includes(a.tool))showPagination(response);status.textContent="Consulta concluída."}catch(e){status.textContent="Não foi possível consultar: "+(e?.message??"erro desconhecido")}finally{run.disabled=false}}
previous.addEventListener("click",()=>{page.value=String(Math.max(1,Number(page.value||1)-1));execute()});next.addEventListener("click",()=>{page.value=String(Number(page.value||1)+1);execute()});limit.addEventListener("change",()=>{page.value="1"});action.addEventListener("change",update);run.addEventListener("click",execute);app.onhostcontextchanged=ctx=>{if(ctx?.theme)applyDocumentTheme(ctx.theme)};try{await app.connect();status.textContent="Conectado ao host MCP Apps."}catch(e){status.textContent="Este host não concluiu a conexão MCP Apps. As ferramentas textuais continuam disponíveis."}update();
</script></body></html>
